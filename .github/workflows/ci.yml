name: SafetyLog CI/CD

on:
  push:
    branches: ['main', 'feature/**', 'fix/**']
  pull_request:
    branches: ['main']

jobs:
  backend:
    name: Laravel API (Tests & Pint)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: safetylog_test
          POSTGRES_USER: safetylog
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U safetylog -d safetylog_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_pgsql, pgsql, gd, mbstring, xml, bcmath
          coverage: none

      - name: Install Composer dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        working-directory: api
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Laravel Pint check
        working-directory: api
        run: ./vendor/bin/pint --test

      - name: Run PHPUnit tests (SQLite in-memory)
        working-directory: api
        run: php artisan test

      - name: Run PHPUnit tests (PostgreSQL + pg_trgm)
        working-directory: api
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: safetylog_test
          DB_USERNAME: safetylog
          DB_PASSWORD: secret
        run: php artisan test

  frontend:
    name: React PWA (Lint & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install npm dependencies
        working-directory: web
        run: npm ci

      - name: Run oxlint
        working-directory: web
        run: npm run lint

      - name: Run TypeScript typecheck & production build
        working-directory: web
        run: npm run build

  deploy:
    name: Deploy to Railway (Production)
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: railway-production-deploy
      cancel-in-progress: false

    env:
      RAILWAY_TOKEN_SECRET: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_API_TOKEN_SECRET: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: f3f4b408-82ec-4fea-8d56-be4dc5046200
      RAILWAY_ENVIRONMENT_ID: e27be57f-1978-4170-bf9f-a6248e45e057
      RAILWAY_API_SERVICE_ID: 8b39aa74-34c3-47fb-acd3-371a51c0a881
      RAILWAY_WEB_SERVICE_ID: b1700f7f-1549-418c-9549-3f4ce9e91879

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Backend API (safetylog-api) & Frontend PWA (safetylog-web)
        run: |
          TOKEN="${RAILWAY_TOKEN_SECRET:-$RAILWAY_API_TOKEN_SECRET}"
          if [ -z "$TOKEN" ]; then
            echo "::warning::Secret RAILWAY_TOKEN belum diatur di GitHub Repository Secrets. Lewati langkah deploy via GitHub Actions (atau gunakan Railway GitHub App autodeploy)."
            exit 0
          fi

          deploy_service() {
            local dir="$1"
            local svc_id="$2"
            local label="$3"

            if RAILWAY_TOKEN="$TOKEN" railway up "$dir" --path-as-root \
              --project "$RAILWAY_PROJECT_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" \
              --service "$svc_id" \
              --ci -m "GitHub Actions CD: deploy ${label} (${GITHUB_SHA::7})"; then
              return 0
            fi

            echo "Mencoba ulang menggunakan mode RAILWAY_API_TOKEN..."
            RAILWAY_API_TOKEN="$TOKEN" railway up "$dir" --path-as-root \
              --project "$RAILWAY_PROJECT_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" \
              --service "$svc_id" \
              --ci -m "GitHub Actions CD: deploy ${label} (${GITHUB_SHA::7})"
          }

          deploy_service "./api" "$RAILWAY_API_SERVICE_ID" "safetylog-api"
          deploy_service "./web" "$RAILWAY_WEB_SERVICE_ID" "safetylog-web"
