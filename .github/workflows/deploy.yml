name: Deploy to cPanel

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install & Build Frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Deploy Frontend ke public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: web/dist/
          server-dir: public_html/

      - name: Deploy Backend ke safetylog_api
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: api/
          server-dir: safetylog_api/
          exclude: |
            .git*
            .git*/**
            **/.git*
            **/.git*/**
            .env*
            **/.env*
            vendor/**
            **/vendor/**
            storage/**
            **/storage/**
            tests/**
            **/tests/**
            node_modules/**
            **/node_modules/**

      - name: Jalankan Migrasi Database Otomatis
        run: |
          curl -s -f "https://api.safetylog.web.id/api/system/setup?key=${{ secrets.APP_SETUP_KEY }}" || true
